databaseChangeLog:
  - changeSet:
      id: 6d-001-create-warehouses
      author: dzencode
      changes:
        - createTable:
            tableName: warehouses
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: VARCHAR(32)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: latitude
                  type: DECIMAL(9,6)
                  constraints: { nullable: false }
              - column:
                  name: longitude
                  type: DECIMAL(9,6)
                  constraints: { nullable: false }
        - sql:
            sql: ALTER TABLE warehouses ADD CONSTRAINT chk_warehouses_coordinates CHECK (latitude BETWEEN -90 AND 90 AND longitude BETWEEN -180 AND 180), ADD CONSTRAINT chk_warehouses_text CHECK (CHAR_LENGTH(TRIM(code)) > 0 AND CHAR_LENGTH(TRIM(name)) > 0 AND CHAR_LENGTH(TRIM(address)) > 0)
  - changeSet:
      id: 6d-002-order-warehouse
      author: dzencode
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: warehouse_id
                  type: INT
        - addForeignKeyConstraint:
            constraintName: fk_orders_warehouse
            baseTableName: orders
            baseColumnNames: warehouse_id
            referencedTableName: warehouses
            referencedColumnNames: id
            onDelete: RESTRICT
  - changeSet:
      id: 6d-003-demo-warehouses
      author: dzencode
      changes:
        - loadData:
            file: data/warehouses.csv
            relativeToChangelogFile: true
            tableName: warehouses
            encoding: UTF-8
            columns:
              - column: { name: latitude, type: NUMERIC }
              - column: { name: longitude, type: NUMERIC }
