# Demo data (context `seed`). Rows with ids 1-2 (products) and 1-3 (orders) come from docs/task-materials/app.js,
# the rest is added so that lists and the type filter have something to show.
databaseChangeLog:
  - changeSet:
      id: 005-seed-product-types
      author: dzencode
      context: seed
      changes:
        - loadData:
            file: data/product_types.csv
            relativeToChangelogFile: true
            tableName: product_types
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: name, type: STRING }
      rollback:
        - delete:
            tableName: product_types

  - changeSet:
      id: 006-seed-orders
      author: dzencode
      context: seed
      changes:
        - loadData:
            file: data/orders.csv
            relativeToChangelogFile: true
            tableName: orders
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: title, type: STRING }
              - column: { name: description, type: STRING }
              - column: { name: date, type: DATETIME }
      rollback:
        - delete:
            tableName: orders

  - changeSet:
      id: 007-seed-products
      author: dzencode
      context: seed
      changes:
        - loadData:
            file: data/products.csv
            relativeToChangelogFile: true
            tableName: products
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: serial_number, type: NUMERIC }
              - column: { name: is_new, type: BOOLEAN }
              - column: { name: photo, type: STRING }
              - column: { name: title, type: STRING }
              - column: { name: type_id, type: NUMERIC }
              - column: { name: specification, type: STRING }
              - column: { name: guarantee_start, type: DATETIME }
              - column: { name: guarantee_end, type: DATETIME }
              - column: { name: order_id, type: NUMERIC }
              - column: { name: date, type: DATETIME }
      rollback:
        - delete:
            tableName: products

  - changeSet:
      id: 008-seed-product-prices
      author: dzencode
      context: seed
      changes:
        - loadData:
            file: data/product_prices.csv
            relativeToChangelogFile: true
            tableName: product_prices
            columns:
              - column: { name: product_id, type: NUMERIC }
              - column: { name: value, type: NUMERIC }
              - column: { name: symbol, type: STRING }
              - column: { name: is_default, type: BOOLEAN }
      rollback:
        - delete:
            tableName: product_prices
