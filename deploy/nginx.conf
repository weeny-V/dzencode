pid /tmp/inventory-nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 512; }
http {
  access_log off;
  client_body_temp_path /tmp/inventory-client;
  proxy_temp_path /tmp/inventory-proxy;
  fastcgi_temp_path /tmp/inventory-fastcgi;
  uwsgi_temp_path /tmp/inventory-uwsgi;
  scgi_temp_path /tmp/inventory-scgi;
  client_max_body_size 1m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; http http; }
  server {
    listen __PORT__;
    server_name _;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 75s;
    location /api/ { proxy_pass http://127.0.0.1:4000/; }
    location /socket.io/ {
      proxy_pass http://127.0.0.1:4000;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
  }
}
